<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Anchor - Server Powered</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: white; min-height: 100vh; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .input-field { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; width: 100%; color: white; outline: none; }
        .btn-news { background: #ef4444; font-weight: 800; padding: 12px; border-radius: 12px; width: 100%; transition: 0.3s; }
        .btn-news:hover { background: #dc2626; }
        .output-card { background: rgba(255,255,255,0.05); border-left: 4px solid #ef4444; padding: 15px; margin-bottom: 10px; border-radius: 0 8px 8px 0; font-family: 'Merriweather', serif; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-black text-center mb-8 uppercase tracking-tighter">AI News <span class="text-red-500">Anchor</span> (Secure)</h1>
        
        <div class="grid lg:grid-cols-2 gap-8">
            <div class="glass-panel p-6 space-y-4">
                <input id="nTopic" class="input-field" placeholder="Topik Berita">
                <textarea id="nFacts" class="input-field h-32" placeholder="Fakta-fakta utama..."></textarea>
                <div class="grid grid-cols-2 gap-4">
                    <select id="styleSelect" class="input-field">
                        <option value="Formal">Formal</option>
                        <option value="Breaking News">Breaking News</option>
                    </select>
                    <select id="voiceSelect" class="input-field">
                        <option value="Charon">Charon (Pria)</option>
                        <option value="Kore">Kore (Wanita)</option>
                    </select>
                </div>
                <button id="genBtn" onclick="handleGenerate()" class="btn-news">SUSUN NASKAH</button>
            </div>

            <div class="glass-panel p-6">
                <div class="flex justify-between mb-4">
                    <h2 class="font-bold">Teleprompter</h2>
                    <div id="controls" class="hidden flex gap-2">
                        <button onclick="handleTTS()" class="bg-blue-600 px-3 py-1 rounded text-xs font-bold">PUTAR SUARA</button>
                    </div>
                </div>
                <div id="output" class="space-y-2 text-sm leading-relaxed">
                    <p class="opacity-30 italic">Naskah akan muncul di sini...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = "http://localhost:3000"; // Sesuaikan dengan URL server Anda
        let currentScript = null;

        async function handleGenerate() {
            const topic = document.getElementById('nTopic').value;
            const facts = document.getElementById('nFacts').value;
            const style = document.getElementById('styleSelect').value;

            if(!topic || !facts) return alert("Lengkapi data!");

            document.getElementById('output').innerHTML = "Sedang menulis...";
            
            try {
                const response = await fetch(`${SERVER_URL}/api/generate-news`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, facts, style })
                });
                const data = await response.json();
                currentScript = JSON.parse(data.candidates[0].content.parts[0].text);
                
                document.getElementById('output').innerHTML = `
                    <div class="output-card"><strong>${currentScript.headline}</strong></div>
                    <div class="output-card">${currentScript.lead}</div>
                    <div class="output-card">${currentScript.body}</div>
                    <div class="output-card opacity-60">${currentScript.closing}</div>
                `;
                document.getElementById('controls').classList.remove('hidden');
            } catch (err) {
                alert("Server tidak merespons. Pastikan Node.js sudah dijalankan.");
            }
        }

        async function handleTTS() {
            const voice = document.getElementById('voiceSelect').value;
            const text = `${currentScript.lead} ${currentScript.body} ${currentScript.closing}`;

            try {
                const response = await fetch(`${SERVER_URL}/api/generate-tts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, voice })
                });
                const data = await response.json();
                const audioData = data.candidates[0].content.parts[0].inlineData.data;
                
                const blob = pcmToWav(audioData, 24000);
                const audio = new Audio(URL.createObjectURL(blob));
                audio.play();
            } catch (err) {
                alert("Gagal memproses suara.");
            }
        }

        function pcmToWav(base64Pcm, sampleRate) {
            const byteCharacters = atob(base64Pcm);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
            const pcmData = new Uint8Array(byteNumbers);
            const header = new ArrayBuffer(44);
            const view = new DataView(header);
            view.setUint32(0, 0x52494646, false);
            view.setUint32(4, 36 + pcmData.length, true);
            view.setUint32(8, 0x57415645, false);
            view.setUint32(12, 0x666d7420, false);
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            view.setUint32(36, 0x64617461, false);
            view.setUint32(40, pcmData.length, true);
            return new Blob([header, pcmData], { type: 'audio/wav' });
        }
    </script>
</body>
</html>
